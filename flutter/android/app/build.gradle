import com.google.protobuf.gradle.*
import groovy.json.JsonSlurper

plugins {
    id "com.google.protobuf" version "0.9.4"
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def nikoTestSigning = System.getenv('NIKODESK_TEST_SIGNING') == '1'
def nikoUnsignedBuild = System.getenv('NIKODESK_UNSIGNED_BUILD') == '1'
if (nikoTestSigning && nikoUnsignedBuild) {
    throw new GradleException('Choose persistent signing or an unsigned structure build, never both')
}
def nikoTestKeystoreProperties = new Properties()
if (nikoTestSigning) {
    def propertiesPath = System.getenv('NIKODESK_TEST_SIGNING_PROPERTIES')
    if (!propertiesPath || !file(propertiesPath).isFile()) {
        throw new GradleException('Stable NikoDesk test signing is required: set NIKODESK_TEST_SIGNING_PROPERTIES to a private key.properties file. Ephemeral debug signing is disabled.')
    }
    file(propertiesPath).withInputStream { nikoTestKeystoreProperties.load(it) }
    for (field in ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']) {
        if (!nikoTestKeystoreProperties[field]) {
            throw new GradleException('Incomplete NikoDesk test signing properties')
        }
    }
    if (!file(nikoTestKeystoreProperties['storeFile']).isFile()) {
        throw new GradleException('NikoDesk test keystore is missing; restore the existing key instead of generating a replacement')
    }
}
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Add rustls-platform-verifier Android support
String findRustlsPlatformVerifierMavenDir() {
    def dependencyText = providers.exec {
        it.workingDir = new File("../..")
        commandLine("cargo", "metadata", "--locked", "--offline", "--format-version", "1",
                    "--filter-platform", "aarch64-linux-android")
    }.standardOutput.asText.get()

    def dependencyJson = new JsonSlurper().parseText(dependencyText)
    def pkg = dependencyJson.packages.find { it.name == "rustls-platform-verifier-android" }
    
    if (pkg == null) {
        throw new GradleException("rustls-platform-verifier-android package not found in cargo metadata!")
    }
    
    def manifestPath = file(pkg.manifest_path)
    def mavenDir = new File(manifestPath.parentFile, "maven")
    
    if (!mavenDir.exists()) {
        throw new GradleException("Maven directory not found at: ${mavenDir.path}")
    }
    
    println("✓ Found rustls-platform-verifier maven repo at: ${mavenDir.path}")
    return mavenDir.path
}


repositories {
    maven {
        url = findRustlsPlatformVerifierMavenDir()
        metadataSources.artifact()
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.20.1'
    }

    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java {
                    option "lite"
                }
            }
        }
    }
}

android {
    namespace "com.carriez.flutter_hbb"
    compileSdkVersion 36
    buildToolsVersion "36.0.0"
    ndkVersion "28.2.13676358"
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'

        main.proto.srcDirs += '../../../libs/base/protos'
        main.proto.includes += "message.proto"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.carriez.flutter_hbb"
        minSdkVersion 22
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    flavorDimensions "client"
    productFlavors {
        rustdesk {
            dimension "client"
        }
        nikodesk {
            dimension "client"
            applicationId "io.nikodesk.android"
        }
    }

    signingConfigs {
      nikodeskTest {
        if (nikoTestSigning) {
          keyAlias nikoTestKeystoreProperties['keyAlias']
          keyPassword nikoTestKeystoreProperties['keyPassword']
          storeFile file(nikoTestKeystoreProperties['storeFile'])
          storePassword nikoTestKeystoreProperties['storePassword']
        }
      }
      release {
        keyAlias keystoreProperties['keyAlias']
        keyPassword keystoreProperties['keyPassword']
        storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
        storePassword keystoreProperties['storePassword']
      }
    }

    buildTypes {
        release {
            // The .dev channel retains one private signing identity across builds.
            signingConfig nikoUnsignedBuild ? null : (nikoTestSigning ? signingConfigs.nikodeskTest : signingConfigs.release)
            if (nikoTestSigning || nikoUnsignedBuild) {
                applicationIdSuffix ".dev"
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'com.google.protobuf:protobuf-javalite:3.20.1'
    implementation "androidx.media:media:1.6.0"
    implementation 'com.github.getActivity:XXPermissions:18.5'
    implementation("org.jetbrains.kotlin:kotlin-stdlib") { version { strictly("1.9.10") } }
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation "rustls:rustls-platform-verifier:0.1.1"
}
