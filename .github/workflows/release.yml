name: Release NikoDesk

# Every push to main builds all three platforms and replaces the rolling
# `nightly` pre-release; a v* tag publishes a formal release. Windows and
# Android still need target-device acceptance, which the notes say plainly.
on:
  push:
    branches:
      - main
      - 'validation/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      experimental_platforms:
        description: Build Windows and Android experiments (runtime acceptance pending)
        type: boolean
        default: true
      windows_setup_validation:
        description: Build and upload the unsigned Windows unattended validation bundle (does not install)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Only superseded validation runs are cancelled; a main push must never kill
  # an in-flight nightly publish between its release delete and create.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/validation/') }}

env:
  FLUTTER_VERSION: "3.24.5"
  # Public fingerprint of the io.nikodesk.android release key kept in secrets.
  ANDROID_RELEASE_CERT_SHA256: "fa45da96bd9214f56213c8f636b3afd033aeaabbc61475c0fd3bd2ed9c8be279"
  RUST_VERSION: "1.88.0"
  CARGO_NDK_VERSION: "3.1.2"
  NDK_VERSION: "r28c"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-macos:
    name: macOS ARM64
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.3'
      FLUTTER_XCODE_ARCHS: arm64
      FLUTTER_XCODE_ONLY_ACTIVE_ARCH: 'YES'
      VCPKG_DEFAULT_TRIPLET: arm64-osx
      VCPKG_DEFAULT_HOST_TRIPLET: arm64-osx
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Read product version
        id: product-version
        run: python3 .github/scripts/product-version.py --github-output

      - name: Install build runtime
        run: |
          brew install llvm pkg-config

      - name: Install NASM 2.16
        run: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff || true
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: macos-arm64
          cache-on-failure: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install pinned native dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-osx \
            --overlay-ports="$GITHUB_WORKSPACE/res/vcpkg-nikodesk" \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Build the Rust core
        run: |
          cargo build --locked --lib --release \
            --features flutter,hwcodec,unix-file-copy-paste,screencapturekit,nikodesk
          cp target/release/liblibrustdesk.dylib target/release/librustdesk.dylib

      - name: Build the Flutter app
        working-directory: flutter
        env:
          PRODUCT_VERSION: ${{ steps.product-version.outputs.version_name }}
          PRODUCT_BUILD_NUMBER: ${{ steps.product-version.outputs.build_number }}
        run: |
          flutter pub get
          flutter build macos --release --dart-define=NIKODESK=true --build-name "$PRODUCT_VERSION" --build-number "$PRODUCT_BUILD_NUMBER"

      - name: Test video recovery, Mac key mapping and upstream compatibility
        run: |
          cargo test --locked --release --lib \
            --features flutter,hwcodec,unix-file-copy-paste,screencapturekit,nikodesk \
            nikodesk::video_queue::tests
          cargo test --locked --release --lib \
            --features flutter,hwcodec,unix-file-copy-paste,screencapturekit,nikodesk \
            nikodesk::mac_shortcuts::tests
          cargo test --locked --release --lib \
            --features flutter,hwcodec,unix-file-copy-paste,screencapturekit,nikodesk \
            nikodesk::server_settings::tests
          cargo check --locked --lib --bins \
            --features flutter,hwcodec,unix-file-copy-paste,screencapturekit

      - name: Test NikoDesk and upstream Flutter paths
        working-directory: flutter
        run: |
          flutter test --no-pub --dart-define=NIKODESK=true
          flutter test --no-pub --dart-define=NIKODESK=false

      - name: Sign and package
        run: |
          APP="flutter/build/macos/Build/Products/Release/NikoDesk.app"
          python3 .github/scripts/prepare-macos-camera.py "$APP"
          python3 .github/scripts/package-macos.py "$APP" --prepare-coreaudio-licenses
          python3 .github/scripts/build-macos-privacy-watchdog.py "$APP" --architecture arm64
          cp LICENCE "$APP/Contents/Resources/NikoDesk-LICENCE.txt"
          printf 'NikoDesk source: https://github.com/%s/tree/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            > "$APP/Contents/Resources/NikoDesk-SOURCE.txt"
          bash .github/scripts/sign-macos-app.sh "$APP" - flutter/macos/Runner/NikoLocalDevelopment.entitlements
          python3 .github/scripts/package-macos.py "$APP" dist --require-privacy-watchdog --require-camera --require-voice

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NikoDesk-macos-arm64
          path: dist/NikoDesk-macos-arm64*
          if-no-files-found: error

  build-windows:
    name: Windows x64
    if: github.event_name == 'push' || inputs.experimental_platforms || inputs.windows_setup_validation
    runs-on: windows-2022
    env:
      NIKODESK_WINDOWS_SETUP_VALIDATION: ${{ github.event_name == 'push' || inputs.windows_setup_validation }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Read product version
        id: product-version
        run: python3 .github/scripts/product-version.py --github-output

      - name: Install LLVM and NASM
        run: choco install -y llvm nasm

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname (Get-Command flutter).Source))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          cd "$(Split-Path (Get-Command flutter).Source -Parent)"
          (Get-Content ..\packages\flutter\lib\src\scheduler\binding.dart) -replace '_setFramesEnabledState\(false\);', '//' | Set-Content ..\packages\flutter\lib\src\scheduler\binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-x64
          cache-on-failure: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows-static --overlay-ports="$env:GITHUB_WORKSPACE\res\vcpkg-nikodesk" --x-install-root="$env:VCPKG_ROOT\installed"
          if ($LASTEXITCODE -ne 0) { Get-ChildItem "$env:VCPKG_ROOT\buildtrees" -Recurse -Filter "*.log" | ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName }; exit 1 }

      - name: Build NikoDesk
        id: client
        shell: pwsh
        env:
          NIKODESK_SOURCE_REVISION: ${{ github.sha }}
          NIKODESK_SOURCE_DIRTY: 'false'
          PRODUCT_VERSION: ${{ steps.product-version.outputs.version_name }}
          PRODUCT_BUILD_NUMBER: ${{ steps.product-version.outputs.build_number }}
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --index-url https://pypi.org/simple --target .tools/package-verifier Brotli==1.2.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH="$env:GITHUB_WORKSPACE\.tools\package-verifier"
          python3 .github/scripts/build-windows-product.py --build-name "$env:PRODUCT_VERSION" --build-number "$env:PRODUCT_BUILD_NUMBER"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $bundle="flutter\build\windows\x64\runner\Release"
          foreach ($required in @('NikoDesk.exe', 'librustdesk.dll', 'flutter_windows.dll', 'data\app.so', 'data\icudtl.dat')) {
            if (!(Test-Path "$bundle\$required")) { throw "Missing bundle file: $required" }
          }
          if (!(Test-Path 'NikoDesk-windows-x64.exe')) { throw 'Missing NikoDesk portable executable' }
          Set-Content "$bundle\EXPERIMENTAL.txt" 'Preview user-mode client: target-device acceptance is still in progress. It runs beside RustDesk without replacing it and installs no service.'
          Compress-Archive -Path "$bundle\*" -DestinationPath NikoDesk-windows-x64.zip

      # Uploaded before the checks below, none of which had run on a real
      # Windows build before: the client stays available for target-device
      # testing while a failing check is being worked on.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NikoDesk-windows-x64
          path: |
            NikoDesk-windows-x64.exe
            NikoDesk-windows-x64.zip
          if-no-files-found: error

      - name: Verify Windows package contents without launching
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/.tools/package-verifier
          PRODUCT_VERSION: ${{ steps.product-version.outputs.version_name }}
          PRODUCT_BUILD_NUMBER: ${{ steps.product-version.outputs.build_number }}
        run: |
          python3 .github/scripts/verify-package-windows.py --bundle flutter/build/windows/x64/runner/Release --portable NikoDesk-windows-x64.exe --zip NikoDesk-windows-x64.zip --blob libs/portable/data.bin --version-name "$env:PRODUCT_VERSION" --build-number "$env:PRODUCT_BUILD_NUMBER" --license-file LICENCE --source-revision "$env:GITHUB_SHA" --source-dirty false --native-protocol-version 1.5.0 --require-display-driver --report-output NikoDesk-windows-x64-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NikoDesk-windows-x64-verification
          path: NikoDesk-windows-x64-verification.json
          if-no-files-found: error

      - name: Build the unattended setup validation bundle
        id: setup
        if: ${{ !cancelled() && steps.package.outcome == 'success' && env.NIKODESK_WINDOWS_SETUP_VALIDATION == 'true' }}
        shell: pwsh
        env:
          NIKODESK_SOURCE_REVISION: ${{ github.sha }}
          NIKODESK_SOURCE_DIRTY: 'false'
          PRODUCT_VERSION: ${{ steps.product-version.outputs.version_name }}
          PRODUCT_BUILD_NUMBER: ${{ steps.product-version.outputs.build_number }}
        run: |
          $env:PYTHONPATH="$env:GITHUB_WORKSPACE\.tools\package-verifier"
          # The notice describes the portable client and is not part of the setup tree.
          Remove-Item "flutter\build\windows\x64\runner\Release\EXPERIMENTAL.txt"
          New-Item -ItemType Directory -Force dist | Out-Null
          python3 .github/scripts/build-windows-product.py --build-name "$env:PRODUCT_VERSION" --build-number "$env:PRODUCT_BUILD_NUMBER" --setup-output dist/NikoDesk-windows-x64-setup-validation --setup-trust-mode reviewed-local-unsigned-validation --reuse-client-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload setup validation artifacts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NikoDesk-windows-x64-setup-validation
          path: |
            dist/NikoDesk-windows-x64-setup-validation.exe
            dist/NikoDesk-windows-x64-setup-validation.zip
            dist/NikoDesk-windows-x64-setup-validation.json
            dist/NikoDesk-windows-x64-setup-validation.txt
          if-no-files-found: error

      - name: Test Windows identity and portable boundaries
        if: ${{ !cancelled() && steps.client.outcome == 'success' }}
        shell: pwsh
        run: |
          # The build step gets rc.exe through build-windows-product.py's own
          # lookup; this fresh shell does not, and build.rs refuses to produce
          # unversioned host/setup binaries without it.
          $rc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\rc.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $rc) { throw 'Windows SDK rc.exe not found for the version-resource build' }
          $env:NIKODESK_WINDOWS_RC = $rc.FullName
          cargo test --locked --lib --features flutter,hwcodec,nikodesk nikodesk_windows_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --lib --features flutter,hwcodec,nikodesk nikodesk::mac_shortcuts::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p rustdesk-portable-packer --features nikodesk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Minutes instead of the full build: the packaging scripts are checked
  # against Windows file semantics on their own.
  test-windows-packaging:
    name: Windows packaging script tests
    if: github.event_name == 'push' || inputs.experimental_platforms || inputs.windows_setup_validation
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Run the packaging script tests
        shell: pwsh
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --index-url https://pypi.org/simple --target .tools/package-verifier Brotli==1.2.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH="$env:GITHUB_WORKSPACE\.tools\package-verifier"
          python3 -m unittest discover -s .github/scripts/tests -p "test_*windows*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 -m unittest discover -s libs/portable/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build-android:
    name: Android ARM64
    if: github.event_name == 'push' || inputs.experimental_platforms
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Read product version
        id: product-version
        run: python3 .github/scripts/product-version.py --github-output

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc-multilib g++-multilib gcc git g++ \
            libc6-dev libclang-dev libunwind-dev llvm-dev nasm ninja-build \
            pkg-config wget unzip

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-24.04 runner ships the Android SDK preinstalled; the
      # extra setup-android step failed on it, so only the NDK is added.
      - name: Install NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: android-arm64
          cache-on-failure: true

      # hwcodec's build script unconditionally links the vcpkg-built ffmpeg,
      # so the Android triplet must be installed before the Rust build and
      # VCPKG_ROOT must be present (it panics on a missing variable).
      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-android \
            --overlay-ports=res/vcpkg-nikodesk \
            --x-install-root="$VCPKG_ROOT/installed"
          # hwcodec reads this exact triplet path; fail here rather than during C++ compilation.
          android_deps="$VCPKG_ROOT/installed/arm64-android"
          for header in libavutil/attributes.h libavutil/opt.h libavcodec/avcodec.h; do
            test -s "$android_deps/include/$header" || { echo "Missing Android dependency header: $header"; exit 1; }
          done
          for library in avcodec avformat avutil; do
            test -s "$android_deps/lib/lib$library.a" || { echo "Missing Android dependency library: $library"; exit 1; }
          done

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked

      - name: Build the Rust core
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: '-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384'
        run: |
          export LIBCLANG_PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/lib"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android -D__ANDROID_API__=22"
          cargo ndk --platform 22 --target aarch64-linux-android build --locked --release \
            --features flutter,hwcodec,nikodesk

      # The release key exists only in this repository's secrets; elsewhere (forks)
      # the job falls back to the unsigned .dev structure build.
      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nikodesk-release.p12"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=nikodesk\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/nikodesk-release.p12" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > flutter/android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NIKODESK_UNSIGNED_BUILD: ${{ steps.signing.outputs.signed != 'true' && '1' || '' }}
          APK_NAME: ${{ steps.signing.outputs.signed == 'true' && 'NikoDesk-android-arm64' || 'NikoDesk-android-arm64-unsigned' }}
          PRODUCT_VERSION: ${{ steps.product-version.outputs.version_name }}
          PRODUCT_BUILD_NUMBER: ${{ steps.product-version.outputs.build_number }}
        run: |
          # Gradle runs `cargo metadata --offline`, which reads the manifest of every
          # locked package, other platforms' included. A --target fetch is not enough.
          cargo fetch --locked
          cargo metadata --locked --offline --format-version 1 --filter-platform aarch64-linux-android > "$RUNNER_TEMP/nikodesk-android-cargo-metadata.json"
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          pushd flutter
          flutter pub get --enforce-lockfile
          flutter build apk --release --flavor nikodesk --target-platform android-arm64 --no-pub --dart-define=NIKODESK=true --build-name "$PRODUCT_VERSION" --build-number "$PRODUCT_BUILD_NUMBER"
          mv build/app/outputs/flutter-apk/app-nikodesk-release.apk "../$APK_NAME.apk"
          popd
          rm -f flutter/android/key.properties
          if [ -n "$NIKODESK_UNSIGNED_BUILD" ]; then
            printf '%s\n' 'Unsigned structural build (io.nikodesk.android.dev). This APK cannot be installed or used for upgrade validation.' > NikoDesk-android-arm64-unsigned.txt
          fi

      - name: Verify final controller APK
        env:
          PRODUCT_VERSION: ${{ steps.product-version.outputs.version_name }}
          PRODUCT_BUILD_NUMBER: ${{ steps.product-version.outputs.build_number }}
        run: |
          # Only the suites that apply here: the Windows and macOS package tests
          # need Brotli, a case-insensitive filesystem or Apple's signing tools.
          python3 -m unittest discover -s .github/scripts/tests -p test_package_android.py -v
          python3 -m unittest discover -s .github/scripts/tests -p test_product_version.py -v
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            python3 .github/scripts/verify-package-android.py NikoDesk-android-arm64.apk \
              --application-id io.nikodesk.android --version-name "$PRODUCT_VERSION" --version-code "$PRODUCT_BUILD_NUMBER" \
              --certificate-sha256 "$ANDROID_RELEASE_CERT_SHA256" --require-owned-voice \
              --manifest-output NikoDesk-android-arm64-manifest.xml \
              --report-output NikoDesk-android-arm64-report.json
          else
            python3 .github/scripts/verify-package-android.py NikoDesk-android-arm64-unsigned.apk \
              --application-id io.nikodesk.android.dev --version-name "$PRODUCT_VERSION" --version-code "$PRODUCT_BUILD_NUMBER" --unsigned \
              --require-owned-voice \
              --manifest-output NikoDesk-android-arm64-unsigned-manifest.xml \
              --report-output NikoDesk-android-arm64-unsigned-report.json
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.signing.outputs.signed == 'true' && 'NikoDesk-android-arm64' || 'NikoDesk-android-arm64-unsigned' }}
          path: NikoDesk-android-arm64*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NikoDesk-android-arm64-verification
          path: |
            NikoDesk-android-arm64*-report.json
            NikoDesk-android-arm64*-manifest.xml
          if-no-files-found: error

  nightly:
    name: Publish nightly pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-macos, build-windows, build-android, test-windows-packaging]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: NikoDesk-*
          merge-multiple: true

      - name: Keep only the packages
        working-directory: dist
        run: |
          find . -type f ! -name '*.dmg' ! -name '*.zip' ! -name '*.exe' ! -name '*.apk' -delete
          ls -la
          test -f NikoDesk-macos-arm64.dmg
          test -f NikoDesk-macos-arm64.zip
          test -f NikoDesk-windows-x64.exe
          test -f NikoDesk-windows-x64.zip
          test -f NikoDesk-windows-x64-setup-validation.exe
          test -f NikoDesk-windows-x64-setup-validation.zip
          test -f NikoDesk-android-arm64.apk
          sha256sum * | tee SHA256SUMS

      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short="${GITHUB_SHA::7}"
          cat > notes.md <<EOF
          Automatic build of \`main\` at [\`$short\`](https://github.com/$GH_REPO/commit/$GITHUB_SHA), replaced on every push. Pre-release: for testing, not a stable version.

          | File | Platform |
          |---|---|
          | \`NikoDesk-macos-arm64.dmg\` | macOS 12.3+, Apple silicon. Ad-hoc signed (no Apple Developer ID): right-click → Open on first launch. |
          | \`NikoDesk-windows-x64.exe\` | Windows 10/11 x64 portable client, runs beside RustDesk, no installation. Unsigned: SmartScreen asks once. |
          | \`NikoDesk-windows-x64.zip\` | The same client as a folder. |
          | \`NikoDesk-windows-x64-setup-validation.exe\` | Windows installer for unattended access (service, sign-in screen, UAC). Unsigned preview; changes the system, use on a test machine first. |
          | \`NikoDesk-android-arm64.apk\` | Android 7+ arm64 controller (\`io.nikodesk.android\`), signed with the NikoDesk release key. |

          Windows and Android packages are still in target-device acceptance. Verify downloads with \`SHA256SUMS\`.
          EOF
          # Only delete a release that exists; a stray tag without a release
          # would make create adopt it and silently ignore --target.
          gh release view nightly >/dev/null 2>&1 && gh release delete nightly --cleanup-tag --yes
          gh release create nightly dist/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "NikoDesk nightly ($short)" --notes-file notes.md

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows, build-android, test-windows-packaging]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: NikoDesk-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          find . -type f ! -name '*.dmg' ! -name '*.zip' ! -name '*.exe' ! -name '*.apk' -delete
          test -f NikoDesk-macos-arm64.dmg
          test -f NikoDesk-macos-arm64.zip
          test -f NikoDesk-windows-x64.exe
          test -f NikoDesk-windows-x64.zip
          test -f NikoDesk-windows-x64-setup-validation.exe
          test -f NikoDesk-windows-x64-setup-validation.zip
          test -f NikoDesk-android-arm64.apk
          sha256sum * | tee SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          name: NikoDesk ${{ github.ref_name }}
          body: |
            macOS (Apple silicon): DMG for installation; the ZIP keeps the updater bundle format. Ad-hoc signature, no Apple Developer ID or notarization.
            Windows x64: portable EXE (no installation) or ZIP; the setup-validation installer adds unattended access. Unsigned.
            Android arm64: controller APK signed with the NikoDesk release key.
            Builds use the tag-matching product version in flutter/pubspec.yaml. Keep your existing remote-control entry while accepting a new device. Cross-device, unattended-system and real-network performance acceptance remain separate from compilation and package checks; no unmeasured speed improvement is claimed.
          files: dist/*
